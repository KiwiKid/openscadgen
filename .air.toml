# .air.toml (rewrite: valid for https://github.com/cosmtrek/air)

root = "."
tmp_dir = "tmp"

[build]
cmd = "templ generate && go build -o ./tmp/main ."
bin = "./tmp/main"
args_bin = []
kill_delay = "0s"
delay = 1000
log = "build-errors.log"
include_ext = ["go", "templ"]
include_dir = []
exclude_dir = ["assets", "tmp", "vendor", "testdata", "___dist", "examples", "bols2otropolis", "library", "pkg/templates", "export", "static", "templates", "tests", "test-export-exclusion"]
exclude_file = []
exclude_regex = ["_test.go"]
full_bin = ""
poll = false
poll_interval = 0
rerun = false
rerun_delay = 500
send_interrupt = false
stop_on_root = false
exclude_unchanged = false
follow_symlink = false

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"


[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false
keep_scroll = true
