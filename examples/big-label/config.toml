[openscadgen]
name = "big-label"
description = ""

version = "v0.1"

export_name_format = "/{designFileName}_{onlySection}"

# export_name_format = "custom-export-name-for-this-file/{designFileName}-{instanceName}"

[[openscadgen.input_paths]]
path = "./big-label.scad"

[[openscadgen.images]]
name = "front"

[[openscadgen.images]]
name = "back"


[[openscadgen.instances]]
params = { onlySection = "none" }

[[openscadgen.instances]]
params = { onlySection = "1,2,3,4,5,6,all" }

