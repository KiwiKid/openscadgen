[openscadgen]
name = "small-tray"
description = ""


version = "v0.1"

export_name_format = "{designFileName}-{instanceName}-{partType}"
global_params = { partType = "box,startBox,endBox" }

[[openscadgen.input_paths]]
path = "./small-tray.scad"

[[openscadgen.instances]]
name = "small-tray"
params = { tray_width = 46, tray_height = 50, height = 28 }

[[openscadgen.instances]]
name = "large-tray"
params = {  tray_width = 230, tray_height = 250 }
 
[[openscadgen.instances.export_images]]
name = "front"
