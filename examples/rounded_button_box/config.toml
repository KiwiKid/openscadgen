# params = { section = ["devSingleBox", "devTopSample", "devTopCorner",  "all", "buttonJiggleBorder"] }



[[openscadgen.images]]
name = "nice"
type = "all_instances"
coord = "0,0,0,45,0,45,1000"

[[openscadgen.images]]
name = "back"
param_filter = { section= "all"}
