[openscadgen]
name = "bolt_sizer"
description = ""

version = "v0.8"

export_name_format = "{exportOrientation}/{mode}"

global_params = { }

[[openscadgen.input_paths]]
path = "./bolt_sizer.scad"


[[openscadgen.instances]]
params = { mode = "box,modifierV2", exportOrientation = "right-side-up,on-side" }

# Guard the repaired bottom-relief placement: this view must remain solid.
[[openscadgen.tests]]
type = "no-holes"
camera = "top"

[[openscadgen.images]]
name = "nice"
param_filter = { mode = "box,modifierV2" }

# These are preview-only composites, not additional printable parts.  They
# deliberately show modifierV2 in red against the assembled sizer.
[[openscadgen.image]]
name = "top-closeup"
params = { mode = "preview", exportOrientation = "right-side-up" }
coord = "0,0,0,0,0,0,240"

[[openscadgen.image]]
name = "preview-cut-closeup"
params = { mode = "previewCut", exportOrientation = "right-side-up" }
coord = "0,0,0,0,0,0,160"

[[openscadgen.image]]
name = "side-closeup"
params = { mode = "preview", exportOrientation = "on-side" }
coord = "0,0,0,90,0,0,140"
