name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install dependencies
        run: go mod download

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.865

      - name: Install OpenSCAD Nightly
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          
          # Try to get the latest nightly build from OpenSCAD snapshots
          # First, let's see what's available
          wget -qO- https://files.openscad.org/snapshots/ | grep -o 'OpenSCAD-[0-9]\{4\}\.[0-9]\{2\}\.[0-9]\{2\}-x86_64.AppImage' | head -1 > latest_nightly.txt
          
          if [ -s latest_nightly.txt ]; then
            LATEST_NIGHTLY=$(cat latest_nightly.txt)
            echo "Found nightly build: $LATEST_NIGHTLY"
            wget -q "https://files.openscad.org/snapshots/$LATEST_NIGHTLY" -O openscad-nightly.AppImage
            chmod +x openscad-nightly.AppImage
            sudo mv openscad-nightly.AppImage /usr/local/bin/openscad
          else
            echo "No nightly build found, falling back to stable"
            sudo apt-get install -y openscad
          fi
          
          echo "OpenSCAD installation completed"

      - name: Verify OpenSCAD installation
        run: |
          echo "Checking OpenSCAD installation..."
          which openscad || echo "OpenSCAD not found in PATH"
          openscad --version || echo "OpenSCAD version check failed"
          echo "PATH: $PATH"
          ls -la /usr/bin/openscad || echo "OpenSCAD not in /usr/bin"
          ls -la /usr/local/bin/openscad || echo "OpenSCAD not in /usr/local/bin"

      - name: Templ Generate
        run: templ generate

      - name: Build
        run: go build -v ./... 

      - name: Test
        run: |
          echo "Running tests with OpenSCAD available..."
          which openscad
          openscad --version
          go test -v ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 